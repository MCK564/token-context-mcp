[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "token-context-mcp"
version = "0.1.0"
description = "Read-only, local code-context MCP server with provenance-aware retrieval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Token Context MCP contributors" }]
dependencies = [
  "mcp>=2.0.0",
  "pathspec>=0.12.1",
  "tree-sitter>=0.24.0",
  "tree-sitter-javascript>=0.23.1",
  "tree-sitter-python>=0.23.6",
  "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]

[project.scripts]
token-context = "token_context_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/token_context_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["token_context_mcp"]
