[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "token-context-mcp"
version = "0.3.5"
description = "On-demand, local code-context MCP server for AI coding agents with Tree-sitter AST & provenance-aware retrieval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Token Context MCP contributors" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "ai-coding-agent",
  "code-context",
  "tree-sitter",
  "ast",
  "claude-code",
  "cursor",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=2.0,<3",
  "mcp-types>=2.0,<3",
  "pathspec>=0.12.1",
  "tree-sitter>=0.24.0",
  "tree-sitter-javascript>=0.23.1",
  "tree-sitter-python>=0.23.6",
  "tree-sitter-typescript>=0.23.2",
  "tree-sitter-java>=0.23.5",
  "tree-sitter-c-sharp>=0.23.1",
  "tree-sitter-html>=0.23.2",
  "pydantic>=2.0.0",
  "tree-sitter-css>=0.23.2",
  "tree-sitter-go>=0.25.0,<0.26",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "psutil>=5.9.0",
]
watch = [
  "watchdog>=4.0.0",
]
gui = [
  "PySide6>=6.6.0",
  "psutil>=5.9.0",
  "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/MCK564/token-context-mcp"
Repository = "https://github.com/MCK564/token-context-mcp"
Documentation = "https://github.com/MCK564/token-context-mcp#readme"
Issues = "https://github.com/MCK564/token-context-mcp/issues"
Changelog = "https://github.com/MCK564/token-context-mcp/blob/main/CHANGELOG.md"

[project.scripts]
token-context = "token_context_mcp.cli:main"
token-context-mcp = "token_context_mcp.cli:main"
token-context-gui = "token_context_mcp.gui.main:main"

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "README.en.md", "README.vi.md", "README.cn.md", "sample_prompt.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/token_context_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["token_context_mcp"]
